<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Del juego original a PS Vita</title>
  <desc id="desc">El código fuente de PC se procesa con las herramientas del port y produce el juego nativo para PS Vita.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b3a"/>
      <stop offset="1" stop-color="#283a75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69d3ff"/>
      <stop offset="1" stop-color="#a6a2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#070d20" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" fill="#d9e5ff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">PORT NATIVO · FLUJO DE COMPILACIÓN</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="46" y="83" width="300" height="151" rx="18" fill="#fff" fill-opacity=".08" stroke="#8aa6ff" stroke-opacity=".48"/>
    <rect x="450" y="83" width="300" height="151" rx="18" fill="#fff" fill-opacity=".08" stroke="#8aa6ff" stroke-opacity=".48"/>
    <rect x="854" y="83" width="300" height="151" rx="18" fill="#fff" fill-opacity=".08" stroke="#8aa6ff" stroke-opacity=".48"/>
    <text x="196" y="132" text-anchor="middle" fill="#84dcff" font-size="14" font-weight="700" letter-spacing="2">01 · ENTRADA</text>
    <text x="196" y="168" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Snoot Game para PC</text>
    <text x="196" y="199" text-anchor="middle" fill="#c8d3f3" font-size="15">Guiones · arte · audio · español</text>
    <text x="600" y="132" text-anchor="middle" fill="#84dcff" font-size="14" font-weight="700" letter-spacing="2">02 · CONVERSIÓN</text>
    <text x="600" y="168" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Herramientas del port</text>
    <text x="600" y="199" text-anchor="middle" fill="#c8d3f3" font-size="15">Compilador · SDL2 · VitaSDK</text>
    <text x="1004" y="132" text-anchor="middle" fill="#84dcff" font-size="14" font-weight="700" letter-spacing="2">03 · RESULTADO</text>
    <text x="1004" y="168" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">PS Vita · 960 × 544</text>
    <text x="1004" y="199" text-anchor="middle" fill="#c8d3f3" font-size="15">VPK + datos locales del juego</text>
  </g>
  <path d="M365 158h64m-14-12 14 12-14 12M769 158h64m-14-12 14 12-14 12" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="466" y="258" width="268" height="23" rx="11.5" fill="#16244d" stroke="#69d3ff" stroke-opacity=".55"/>
  <text x="600" y="274" text-anchor="middle" fill="#b8efff" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">SIN REUTILIZAR LOS PORTS DE PS1 O PSP</text>
</svg>
